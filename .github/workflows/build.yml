name: Build All UI APP
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GONOSUMDB: github.com/oneclickvirt/ecs,github.com/oneclickvirt/speedtest
  PYTHONUTF8: '1'
permissions:
  contents: write
jobs:
  prepare:
    name: Prepare Version and Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-prepare-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      app_version: ${{ steps.version.outputs.APP_VERSION }}
      release_tag: ${{ steps.version.outputs.RELEASE_TAG }}
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/ecs-gui/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.release_tag || github.ref }}
        fetch-depth: 0
    - name: Validate GUI and upstream versions
      id: sync_version
      shell: bash
      run: |
        set -euo pipefail
        python3 .github/scripts/verify_components.py --outputs "$GITHUB_OUTPUT"
        GUI_VERSION="$(tr -d "[:space:]" < VERSION)"
        RELEASE_TAG="${REQUESTED_RELEASE:-${GITHUB_REF#refs/tags/}}"
        [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid immutable release tag." >&2; exit 1; }
        [[ "${RELEASE_TAG#v}" == "$GUI_VERSION" ]] || { echo "Release tag and GUI version differ." >&2; exit 1; }
        [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$(git rev-parse HEAD)" ]] || { echo "Release source does not match immutable tag." >&2; exit 1; }
      env:
        REQUESTED_RELEASE: ${{ inputs.release_tag }}
    - name: Get version info
      id: version
      run: |
        set -euo pipefail
        GUI_VERSION="${{ steps.sync_version.outputs.GUI_VERSION }}"
        RELEASE_TAG="${REQUESTED_RELEASE:-${GITHUB_REF#refs/tags/}}"
        APP_VERSION="${GUI_VERSION}"
        {
          echo "VERSION=${RELEASE_TAG}"
          echo "APP_VERSION=${APP_VERSION}"
          echo "RELEASE_TAG=${RELEASE_TAG}"
        } >> "$GITHUB_OUTPUT"
      env:
        REQUESTED_RELEASE: ${{ inputs.release_tag }}
    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        source "$RUNNER_TEMP/ci-network.sh"
        set -euo pipefail
        RELEASE_TAG="${{ steps.version.outputs.RELEASE_TAG }}"
        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "Release $RELEASE_TAG" --notes "Automated build for $RELEASE_TAG" --draft
        fi
      shell: bash
  build-android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-android-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/ecs-gui/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: main
    - name: Load trusted CI control
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/private-ci-control"
        cp .github/scripts/private_guard.py "$RUNNER_TEMP/private-ci-control/private_guard.py"
        cp .github/scripts/release_assets.py "$RUNNER_TEMP/private-ci-control/release_assets.py"
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ inputs.release_tag || github.ref }}
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Install Fyne CLI
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        go install fyne.io/tools/cmd/fyne@v1.7.3
        PRIVATE_STEP
      shell: bash
      env:
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: platform-tools
    - name: Install Android NDK
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        sdkmanager --install "ndk;25.2.9519653"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
        PRIVATE_STEP
      shell: bash
      env:
        CI_ALLOWED_ENV: ANDROID_NDK_HOME
        CI_ALLOWED_OUTPUT: ANDROID_NDK_HOME,APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Install Android Build Tools
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        sdkmanager --install "build-tools;34.0.0"
        sdkmanager --install "platforms;android-34"
        PRIVATE_STEP
      shell: bash
      env:
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Prepare structured component workspace
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        source "$RUNNER_TEMP/ci-network.sh"
        set -euo pipefail
        rm -rf deps go.work go.work.sum
        mkdir -p deps
        modules="ecs UnlockTests backtrace basics cputest defaultset disktest gostun memorytest nt3 pingtest portchecker privatespeedtest security speedtest"
        for module in $modules; do
          module_path="github.com/oneclickvirt/${module}"
          ref="$(GOWORK=off go list -m -f '{{.Version}}' "$module_path")"
          if [[ -z "$ref" ]]; then
            echo "Unable to resolve ${module_path} from go.mod" >&2
            exit 1
          fi
          echo "${module_path} -> ${ref}"
          git clone --branch "$ref" --single-branch --depth 1 "https://github.com/oneclickvirt/${module}.git" "deps/${module}"
        done
        printf '/deps/\n/go.work\n/go.work.sum\n' >> .git/info/exclude
        go work init .
        for module in $modules; do
          go work use "deps/${module}"
        done
        export GOWORK="$PWD/go.work"
        for module in $modules; do
          resolved="$(go list -m -f '{{.Dir}}' "github.com/oneclickvirt/${module}")"
          expected="$(cd "deps/${module}" && pwd -P)"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            resolved="$(cygpath -m "$resolved")"
            expected="$(cygpath -m "$expected")"
          fi
          if [[ "$resolved" != "$expected" ]]; then
            echo "Workspace did not select ${module}: expected ${expected}, got ${resolved:-<empty>}" >&2
            exit 1
          fi
        done
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: GOWORK,expected,module_path,modules,ref,resolved
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GOWORK,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,expected,gostun,memorytest,module_path,modules,nt3,pingtest,portchecker,privatespeedtest,ref,release_tag,resolved,security,speedtest,tag,unlocktests,version
    - name: Sync build metadata from checked out ecs
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        ECS_VERSION="$(awk -F'"' '/DefaultVersion[[:space:]]*=/{print $2; exit}' deps/ecs/api/api.go)"
        if [[ ! "$ECS_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Unable to detect ecs version from checked out source: $ECS_VERSION"
          exit 1
        fi
        APP_VERSION="${{ needs.prepare.outputs.app_version }}"
        sed -i "s/Version[[:space:]]*= \"[^\"]*\"/Version            = \"${APP_VERSION}\"/" internal/appmeta/version.go
        sed -i "s/UpstreamECSVersion[[:space:]]*= \"[^\"]*\"/UpstreamECSVersion = \"${ECS_VERSION}\"/" internal/appmeta/version.go
        echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
        echo "ECS_VERSION=${ECS_VERSION}" >> "$GITHUB_ENV"
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: APP_VERSION,ECS_VERSION
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Download dependencies
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        set -euo pipefail
        for attempt in 1 2 3; do
          if go mod download; then
            exit 0
          fi
          if [[ "$attempt" == 3 ]]; then
            exit 1
          fi
          sleep "$((attempt * 10))"
        done
        PRIVATE_STEP
      env:
        GOPRIVATE: github.com/oneclickvirt/security,github.com/oneclickvirt/privatespeedtest
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Verify dependencies
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        set -euo pipefail
        go mod verify
        python3 .github/scripts/verify_components.py --workspace
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: GOWORK
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GOWORK,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Update FyneApp.toml version
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        sed -i "s/Version = .*/Version = \"${APP_VERSION}\"/" FyneApp.toml
        cat FyneApp.toml
        PRIVATE_STEP
      shell: bash
      env:
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Build Android APK (arm64)
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        GOPRIVATE: github.com/oneclickvirt/security,github.com/oneclickvirt/privatespeedtest
        FYNE_BUILD_FLAGS: -trimpath -buildvcs=false -ldflags '-s -w -buildid='
        CI_ALLOWED_ENV: apks
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,apks,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        fyne package --os android --app-id com.oneclickvirt.goecs --app-version "${APP_VERSION}" --release
        shopt -s nullglob
        apks=( *.apk )
        if ((${#apks[@]} > 0)); then
          mv "${apks[0]}" ecs-gui-android-arm64-${{ needs.prepare.outputs.version }}.apk
          echo "ARM64 APK 构建成功"
          ls -lh ecs-gui-android-arm64-${{ needs.prepare.outputs.version }}.apk
        else
          echo "ARM64 APK 构建失败"
          exit 1
        fi
        PRIVATE_STEP
      shell: bash
    - name: Build Android APK (x86_64)
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        GOPRIVATE: github.com/oneclickvirt/security,github.com/oneclickvirt/privatespeedtest
        FYNE_BUILD_FLAGS: -trimpath -buildvcs=false -ldflags '-s -w -buildid='
        CI_ALLOWED_ENV: NEW_APK
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,NEW_APK,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        fyne package --os android/amd64 --app-id com.oneclickvirt.goecs --app-version "${APP_VERSION}" --release
        # 查找新生成的 APK（排除已重命名的 arm64 版本）
        NEW_APK=$(find . -maxdepth 1 -name "*.apk" -not -name "ecs-gui-android-*" -type f | head -n 1)
        if [ -n "$NEW_APK" ]; then
          mv "$NEW_APK" ecs-gui-android-x86_64-${{ needs.prepare.outputs.version }}.apk
          echo "x86_64 APK 构建成功"
          ls -lh ecs-gui-android-x86_64-${{ needs.prepare.outputs.version }}.apk
        else
          echo "x86_64 APK 构建失败"
          exit 1
        fi
        PRIVATE_STEP
      shell: bash
    - name: Install UPX
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        source "$RUNNER_TEMP/ci-network.sh"
        wget -q https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-amd64_linux.tar.xz
        tar -xf upx-4.2.1-amd64_linux.tar.xz
        sudo mv upx-4.2.1-amd64_linux/upx /usr/local/bin/
        upx --version
        PRIVATE_STEP
      shell: bash
      env:
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Compress APK with UPX
      run: "python3 \"$RUNNER_TEMP/private-ci-control/private_guard.py\" run <<'PRIVATE_STEP'\nfor apk in ecs-gui-android-*.apk;\
        \ do\n  if [ -f \"$apk\" ]; then\n    echo \"压缩前大小: $(du -h \"$apk\")\"\n    # 解压 APK\n    unzip -q \"$apk\"\
        \ -d \"${apk%.apk}_extracted\"\n    \n    # 对 lib 目录下的 .so 文件使用 UPX 压缩\n    find \"${apk%.apk}_extracted/lib\"\
        \ -name \"*.so\" -type f | while IFS= read -r so_file; do\n      echo \"正在压缩: $so_file\"\n      upx --best\
        \ --lzma \"$so_file\" || echo \"警告: $so_file 压缩失败，继续处理\"\n    done\n    \n    # 重新打包 APK\n    cd \"${apk%.apk}_extracted\"\
        \n    zip -r -q -9 \"../${apk%.apk}_compressed.apk\" .\n    cd ..\n    \n    # 替换原 APK\n    mv \"${apk%.apk}_compressed.apk\"\
        \ \"$apk\"\n    rm -rf \"${apk%.apk}_extracted\"\n    \n    echo \"压缩后大小: $(du -h \"$apk\")\"\n  fi\ndone\n\
        PRIVATE_STEP\n"
      shell: bash
      env:
        CI_ALLOWED_ENV: IFS
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,IFS,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Download signing keystore
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        source "$RUNNER_TEMP/ci-network.sh"
        # 使用 GitHub Token 下载私有仓库的 JKS 文件
        curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
          -H "Authorization: token ${{ secrets.PRIVATE_CI_TOKEN }}" \
          -H "Accept: application/vnd.github.v3.raw" \
          -o oneclickvirt.jks \
          "https://api.github.com/repos/oneclickvirt/jks/contents/oneclickvirt.jks"

        # 验证文件是否下载成功
        if [ -f oneclickvirt.jks ]; then
          echo "✓ JKS 文件下载成功"
          ls -lh oneclickvirt.jks
        else
          echo "✗ JKS 文件下载失败"
          exit 1
        fi
        PRIVATE_STEP
      shell: bash
      env:
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Sign APK files
      run: "python3 \"$RUNNER_TEMP/private-ci-control/private_guard.py\" run <<'PRIVATE_STEP'\n# 安装 apksigner (包含在\
        \ Android build-tools 中)\nBUILD_TOOLS_VERSION=\"34.0.0\"\nAPKSIGNER=\"$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner\"\
        \n\nif [ ! -f \"$APKSIGNER\" ]; then\n  echo \"✗ apksigner 未找到\"\n  exit 1\nfi\n\necho \"使用 apksigner: $APKSIGNER\"\
        \n\n# 对所有 APK 文件进行签名\nfor apk in ecs-gui-android-*.apk; do\n  if [ -f \"$apk\" ]; then\n    echo \"正在签名:\
        \ $apk\"\n    SIGNED_APK=\"${apk%.apk}_signed.apk\"\n    \n    # 签名 APK\n    $APKSIGNER sign \\\n      --ks\
        \ oneclickvirt.jks \\\n      --ks-key-alias gui \\\n      --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }}\
        \ \\\n      --key-pass pass:${{ secrets.KEY_PASSWORD }} \\\n      --out \"$SIGNED_APK\" \\\n      \"$apk\"\
        \n    \n    # 验证签名\n    if \"$APKSIGNER\" verify \"$SIGNED_APK\"; then\n      echo \"✓ $apk 签名成功\"\n   \
        \   # 替换原始 APK\n      mv \"$SIGNED_APK\" \"$apk\"\n    else\n      echo \"✗ $apk 签名验证失败\"\n      exit 1\n\
        \    fi\n  fi\ndone\n\n# 清理 JKS 文件\nrm -f oneclickvirt.jks\nPRIVATE_STEP\n"
      shell: bash
      env:
        CI_ALLOWED_ENV: APKSIGNER,BUILD_TOOLS_VERSION,SIGNED_APK
        CI_ALLOWED_OUTPUT: APKSIGNER,APP_VERSION,BUILD_TOOLS_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,SIGNED_APK,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: List build artifacts
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        ls -lh ecs-gui-android-*.apk
        du -sh ecs-gui-android-*.apk
        PRIVATE_STEP
      shell: bash
      env:
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Upload to release
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        source "$RUNNER_TEMP/ci-network.sh"
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" verify-assets --assets "ecs-gui-*.apk"
        RELEASE_TAG="${{ needs.prepare.outputs.release_tag }}"
        for file in ecs-gui-android-*.apk; do
          if [ -f "$file" ]; then
            echo "Uploading $file to release $RELEASE_TAG"
            python3 "$RUNNER_TEMP/private-ci-control/release_assets.py" "$RELEASE_TAG" "$file"
          fi
        done
        PRIVATE_STEP
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CI_ALLOWED_ENV: RELEASE_TAG
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Upload ARM64 APK
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ecs-gui-android-arm64-${{ needs.prepare.outputs.version }}
        path: ecs-gui-android-arm64-${{ needs.prepare.outputs.version }}.apk
        retention-days: 90
    - name: Upload x86_64 APK
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ecs-gui-android-x86_64-${{ needs.prepare.outputs.version }}
        path: ecs-gui-android-x86_64-${{ needs.prepare.outputs.version }}.apk
        retention-days: 90
    - name: Save diagnostics privately
      if: always()
      shell: bash
      env:
        CI_JOB_STATUS: ${{ job.status }}
      run: python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" archive --repositories security,privatespeedtest,jks
        --status "$CI_JOB_STATUS"
    - name: Remove private workspace
      if: always()
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" clean
        rm -rf deps keystore
        find . -maxdepth 1 -type f -name "*.jks" -delete
    env:
      PRIVATE_CI_TOKEN: ${{ secrets.PRIVATE_CI_TOKEN }}
      CI_JOB_KEY: ${{ github.job }}-${{ strategy.job-index }}
      GOPROXY: https://proxy.golang.org|direct
    if: github.repository_owner == 'oneclickvirt' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v'))
  build-desktop:
    name: Build Desktop Apps
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          platform: darwin
          arch: arm64
          name: macos-arm64
        - os: macos-15-intel
          platform: darwin
          arch: amd64
          name: macos-amd64
        - os: windows-2025
          platform: windows
          arch: amd64
          name: windows-amd64
        - os: windows-2025
          platform: windows
          arch: arm64
          name: windows-arm64
        - os: ubuntu-24.04-arm
          platform: linux
          arch: arm64
          name: linux-arm64
        - os: ubuntu-latest
          platform: linux
          arch: amd64
          name: linux-amd64
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/ecs-gui/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: main
    - name: Load trusted CI control
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/private-ci-control"
        cp .github/scripts/private_guard.py "$RUNNER_TEMP/private-ci-control/private_guard.py"
        cp .github/scripts/release_assets.py "$RUNNER_TEMP/private-ci-control/release_assets.py"
        cp .github/scripts/install_windows_arm64_toolchain.ps1 "$RUNNER_TEMP/private-ci-control/install_windows_arm64_toolchain.ps1"
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ inputs.release_tag || github.ref }}
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Install Fyne CLI
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        go install fyne.io/tools/cmd/fyne@v1.7.3
        PRIVATE_STEP
      shell: bash
      env:
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Install Windows ARM64 C toolchain
      if: matrix.name == 'windows-arm64'
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run --shell pwsh <<'PRIVATE_STEP'
        & "$env:RUNNER_TEMP/private-ci-control/install_windows_arm64_toolchain.ps1"
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: CC,CGO_ENABLED,CXX
        CI_ALLOWED_OUTPUT: APP_VERSION,CC,CGO_ENABLED,CXX,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
        GH_TOKEN: ${{ github.token }}
    - name: Install Linux dependencies
      if: matrix.platform == 'linux'
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        if [ "${{ matrix.arch }}" == "arm64" ]; then
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          sudo apt-get install -y libgl1-mesa-dev xorg-dev
          sudo apt-get install -y \
            libgl1-mesa-dev:arm64 \
            libx11-dev:arm64 \
            libxrandr-dev:arm64 \
            libxxf86vm-dev:arm64 \
            libxi-dev:arm64 \
            libxcursor-dev:arm64 \
            libxinerama-dev:arm64
        else
          # AMD64 使用默认源
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev
        fi
        PRIVATE_STEP
      shell: bash
      env:
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Prepare structured component workspace
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        source "$RUNNER_TEMP/ci-network.sh"
        set -euo pipefail
        rm -rf deps go.work go.work.sum
        mkdir -p deps
        modules="ecs UnlockTests backtrace basics cputest defaultset disktest gostun memorytest nt3 pingtest portchecker privatespeedtest security speedtest"
        for module in $modules; do
          module_path="github.com/oneclickvirt/${module}"
          ref="$(GOWORK=off go list -m -f '{{.Version}}' "$module_path")"
          if [[ -z "$ref" ]]; then
            echo "Unable to resolve ${module_path} from go.mod" >&2
            exit 1
          fi
          echo "${module_path} -> ${ref}"
          git clone --branch "$ref" --single-branch --depth 1 "https://github.com/oneclickvirt/${module}.git" "deps/${module}"
        done
        printf '/deps/\n/go.work\n/go.work.sum\n' >> .git/info/exclude
        go work init .
        for module in $modules; do
          go work use "deps/${module}"
        done
        export GOWORK="$PWD/go.work"
        for module in $modules; do
          resolved="$(go list -m -f '{{.Dir}}' "github.com/oneclickvirt/${module}")"
          expected="$(cd "deps/${module}" && pwd -P)"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            resolved="$(cygpath -m "$resolved")"
            expected="$(cygpath -m "$expected")"
          fi
          if [[ "$resolved" != "$expected" ]]; then
            echo "Workspace did not select ${module}: expected ${expected}, got ${resolved:-<empty>}" >&2
            exit 1
          fi
        done
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: GOWORK,expected,module_path,modules,ref,resolved
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GOWORK,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,expected,gostun,memorytest,module_path,modules,nt3,pingtest,portchecker,privatespeedtest,ref,release_tag,resolved,security,speedtest,tag,unlocktests,version
    - name: Sync build metadata from checked out ecs
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        ECS_VERSION="$(awk -F'"' '/DefaultVersion[[:space:]]*=/{print $2; exit}' deps/ecs/api/api.go)"
        if [[ ! "$ECS_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Unable to detect ecs version from checked out source: $ECS_VERSION"
          exit 1
        fi
        APP_VERSION="${{ needs.prepare.outputs.app_version }}"
        if [ "${{ runner.os }}" == "macOS" ]; then
          sed -i '' "s/Version[[:space:]]*= \"[^\"]*\"/Version            = \"${APP_VERSION}\"/" internal/appmeta/version.go
          sed -i '' "s/UpstreamECSVersion[[:space:]]*= \"[^\"]*\"/UpstreamECSVersion = \"${ECS_VERSION}\"/" internal/appmeta/version.go
        else
          sed -i "s/Version[[:space:]]*= \"[^\"]*\"/Version            = \"${APP_VERSION}\"/" internal/appmeta/version.go
          sed -i "s/UpstreamECSVersion[[:space:]]*= \"[^\"]*\"/UpstreamECSVersion = \"${ECS_VERSION}\"/" internal/appmeta/version.go
        fi
        echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
        echo "ECS_VERSION=${ECS_VERSION}" >> "$GITHUB_ENV"
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: APP_VERSION,ECS_VERSION
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Download dependencies
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        set -euo pipefail
        for attempt in 1 2 3; do
          if go mod download; then
            exit 0
          fi
          if [[ "$attempt" == 3 ]]; then
            exit 1
          fi
          sleep "$((attempt * 10))"
        done
        PRIVATE_STEP
      env:
        GOPRIVATE: github.com/oneclickvirt/security,github.com/oneclickvirt/privatespeedtest
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Verify dependencies
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        set -euo pipefail
        go mod verify
        python3 .github/scripts/verify_components.py --workspace
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: GOWORK
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GOWORK,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Verify release GUI path
      if: matrix.name == 'linux-amd64'
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        go test -race ./ui
        go vet ./...
        PRIVATE_STEP
      shell: bash
      env:
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Verify structured GUI and component adapters
      if: matrix.name == 'linux-amd64'
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        go test -race -tags=ecs_structured ./ui
        go vet -tags=ecs_structured ./...
        PRIVATE_STEP
      shell: bash
      env:
        CI_ALLOWED_ENV: tags
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,tags,unlocktests,version
    - name: Update FyneApp.toml version
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        if [ "${{ runner.os }}" == "macOS" ]; then
          sed -i '' "s/Version = .*/Version = \"${APP_VERSION}\"/" FyneApp.toml
        else
          sed -i "s/Version = .*/Version = \"${APP_VERSION}\"/" FyneApp.toml
        fi
        cat FyneApp.toml
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Install UPX
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        if [ "${{ runner.os }}" == "macOS" ]; then
          brew install upx
          upx --version
        elif [ "${{ runner.os }}" == "Windows" ]; then
          echo "跳过 Windows UPX 安装（不支持）"
        fi
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Build for ${{ matrix.name }}
      env:
        GOPRIVATE: github.com/oneclickvirt/security,github.com/oneclickvirt/privatespeedtest
        FYNE_BUILD_FLAGS: -trimpath -buildvcs=false -ldflags '-s -w -buildid= -checklinkname=0'
        GOARCH: ${{ matrix.arch }}
        CI_ALLOWED_ENV: BUILD_DIR,CC,CGO_ENABLED,GOARCH,GOOS,GZIP,TARFILE,buildid,buildvcs,checklinkname
        CI_ALLOWED_OUTPUT: APP_VERSION,BUILD_DIR,CC,CGO_ENABLED,ECS_VERSION,GOARCH,GOOS,GUI_VERSION,GZIP,RELEASE_TAG,TARFILE,VERSION,backtrace,basics,buildid,buildvcs,checklinkname,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
      shell: bash
      run: "python3 \"$RUNNER_TEMP/private-ci-control/private_guard.py\" run <<'PRIVATE_STEP'\n# macOS 需要特殊处理：先编译再打包\n\
        if [ \"${{ matrix.platform }}\" == \"darwin\" ]; then\n  # 使用独立目录避免冲突\n  BUILD_DIR=\"build-${{ matrix.name\
        \ }}\"\n  mkdir -p \"$BUILD_DIR\"\n  \n  echo \"Building macOS binary with ldflags...\"\n  go build -trimpath\
        \ -buildvcs=false -ldflags \"-checklinkname=0 -s -w -buildid=\" -o \"$BUILD_DIR/ecs-gui-bin\" .\n  \n  echo\
        \ \"Packaging macOS app with fyne...\"\n  # 在根目录运行 fyne package，指定编译好的二进制文件路径\n  fyne package -os darwin\
        \ -name ecs-gui --app-id com.oneclickvirt.goecs --exe \"$BUILD_DIR/ecs-gui-bin\" --app-version \"${APP_VERSION}\"\
        \ --release\n  \n  if [ -d \"ecs-gui.app\" ]; then\n    TARFILE=\"ecs-gui-${{ matrix.name }}-${{ needs.prepare.outputs.version\
        \ }}.tar.gz\"\n    echo \"Creating tar file: $TARFILE\"\n    GZIP=-9 tar -czf \"$TARFILE\" ecs-gui.app\n\
        \    echo \"✓ macOS app 构建成功\"\n    # 清理构建目录和生成的 app\n    rm -rf \"$BUILD_DIR\" ecs-gui.app\n  else\n  \
        \  echo \"✗ macOS app 构建失败\"\n    exit 1\n  fi\nelif [ \"${{ matrix.platform }}\" == \"linux\" ]; then\n\
        \  # Linux 构建 - 使用独立目录避免冲突\n  BUILD_DIR=\"build-${{ matrix.name }}\"\n  mkdir -p \"$BUILD_DIR\"\n  \n  echo\
        \ \"Building Linux binary for ${{ matrix.arch }}...\"\n  if [ \"${{ matrix.arch }}\" == \"arm64\" ]; then\n\
        \    # ARM64 交叉编译\n    CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \\\n      go build\
        \ -trimpath -buildvcs=false -ldflags \"-checklinkname=0 -s -w -buildid=\" -o \"$BUILD_DIR/ecs-gui\" .\n\
        \  else\n    # AMD64 本地编译\n    CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \\\n      go build -trimpath -buildvcs=false\
        \ -ldflags \"-checklinkname=0 -s -w -buildid=\" -o \"$BUILD_DIR/ecs-gui\" .\n  fi\n  \n  echo \"Packaging\
        \ Linux app with fyne...\"\n  # 在根目录运行 fyne package，指定编译好的二进制文件路径\n  fyne package -os linux -name ecs-gui\
        \ --app-id com.oneclickvirt.goecs --exe \"$BUILD_DIR/ecs-gui\" --app-version \"${APP_VERSION}\" --release\n\
        \  \n  # 查找生成的 tar.xz 文件\n  if [ -f \"ecs-gui.tar.xz\" ]; then\n    mv \"ecs-gui.tar.xz\" ecs-gui-${{ matrix.name\
        \ }}-${{ needs.prepare.outputs.version }}.tar.xz\n    echo \"✓ Linux tar.xz 构建成功\"\n    # 清理构建目录\n    rm\
        \ -rf \"$BUILD_DIR\"\n  else\n    echo \"✗ Linux tar.xz 构建失败\"\n    ls -la .\n    exit 1\n  fi\nelse\n \
        \ # Windows 构建\n  echo \"Building ${{ matrix.platform }} with fyne package...\"\n  # 在根目录运行 fyne package\n\
        \  fyne package -os ${{ matrix.platform }} -name ecs-gui --app-id com.oneclickvirt.goecs --app-version \"\
        ${APP_VERSION}\" --release\n  \n  if [ \"${{ matrix.platform }}\" == \"windows\" ]; then\n    if [ -f \"\
        ecs-gui.exe\" ]; then\n      mv \"ecs-gui.exe\" ecs-gui-${{ matrix.name }}-${{ needs.prepare.outputs.version\
        \ }}.exe\n      echo \"✓ Windows exe 构建成功\"\n    else\n      echo \"✗ Windows exe 构建失败\"\n      exit 1\n\
        \    fi\n  fi\nfi\nPRIVATE_STEP\n"
    - name: Compress with UPX
      shell: bash
      run: "python3 \"$RUNNER_TEMP/private-ci-control/private_guard.py\" run <<'PRIVATE_STEP'\n# Windows 跳过 UPX\
        \ 压缩\nif [ \"${{ runner.os }}\" == \"Windows\" ]; then\n  echo \"跳过 Windows exe 的 UPX 压缩（不支持）\"\n  exit\
        \ 0\nfi\n\nfor file in ecs-gui-${{ matrix.name }}-*; do\n  if [ -f \"$file\" ]; then\n    echo \"压缩前大小:\
        \ $(du -h \"$file\")\"\n    \n    if [[ \"$file\" == *.tar.gz ]]; then\n      # macOS app 需要解压后压缩二进制\n \
        \     echo \"正在处理 macOS app: $file\"\n      tar -xzf \"$file\"\n      \n      # 查找并压缩 macOS 可执行文件\n    \
        \  if [ -d ecs-gui.app/Contents/MacOS ]; then\n        for binary in ecs-gui.app/Contents/MacOS/*; do\n\
        \          if [ -f \"$binary\" ] && [ -x \"$binary\" ]; then\n            echo \"正在压缩 macOS 二进制: $binary\"\
        \n            upx --best --lzma \"$binary\" || echo \"警告: $binary 压缩失败\"\n          fi\n        done\n \
        \     fi\n      \n      # 重新打包\n      rm \"$file\"\n      GZIP=-9 tar -czf \"$file\" ecs-gui.app\n     \
        \ rm -rf ecs-gui.app\n      echo \"压缩后大小: $(du -h \"$file\")\"\n    elif [[ \"$file\" == *.tar.xz ]]; then\n\
        \      # Linux app 需要解压后压缩二进制\n      echo \"正在处理 Linux app: $file\"\n      mkdir -p ecs-gui-extracted\n\
        \      tar -xJf \"$file\" -C ecs-gui-extracted\n      \n      # 查找并压缩 Linux 可执行文件\n      find ecs-gui-extracted\
        \ -type f -executable | while IFS= read -r binary; do\n        if file \"$binary\" | grep -q \"ELF\"; then\n\
        \          echo \"正在压缩 Linux 二进制: $binary\"\n          upx --best --lzma \"$binary\" || echo \"警告: $binary\
        \ 压缩失败\"\n        fi\n      done\n      \n      # 重新打包\n      rm \"$file\"\n      XZ_OPT=-9e tar -cJf \"\
        $file\" -C ecs-gui-extracted .\n      rm -rf ecs-gui-extracted\n      echo \"压缩后大小: $(du -h \"$file\")\"\
        \n    fi\n  fi\ndone\nPRIVATE_STEP\n"
      env:
        CI_ALLOWED_ENV: GZIP,IFS,XZ_OPT
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,GZIP,IFS,RELEASE_TAG,VERSION,XZ_OPT,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: List build artifacts
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        ls -lh ecs-gui-${{ matrix.name }}-*
        du -sh ecs-gui-${{ matrix.name }}-*
        PRIVATE_STEP
      env:
        CI_ALLOWED_ENV: ''
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Upload to release
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" run <<'PRIVATE_STEP'
        source "$RUNNER_TEMP/ci-network.sh"
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" verify-assets --assets "ecs-gui-*.zip" "ecs-gui-*.tar.gz" "ecs-gui-*.tar.xz" "ecs-gui-*.exe"
        RELEASE_TAG="${{ needs.prepare.outputs.release_tag }}"
        for file in ecs-gui-${{ matrix.name }}-*; do
          if [ -f "$file" ]; then
            echo "Uploading $file to release $RELEASE_TAG"
            python3 "$RUNNER_TEMP/private-ci-control/release_assets.py" "$RELEASE_TAG" "$file"
          fi
        done
        PRIVATE_STEP
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CI_ALLOWED_ENV: RELEASE_TAG
        CI_ALLOWED_OUTPUT: APP_VERSION,ECS_VERSION,GUI_VERSION,RELEASE_TAG,VERSION,backtrace,basics,cputest,defaultset,disktest,gostun,memorytest,nt3,pingtest,portchecker,privatespeedtest,release_tag,security,speedtest,tag,unlocktests,version
    - name: Upload build artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ecs-gui-${{ matrix.name }}-${{ needs.prepare.outputs.version }}
        path: ecs-gui-${{ matrix.name }}-${{ needs.prepare.outputs.version }}.*
        retention-days: 90
    - name: Save diagnostics privately
      if: always()
      shell: bash
      env:
        CI_JOB_STATUS: ${{ job.status }}
      run: python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" archive --repositories security,privatespeedtest,jks
        --status "$CI_JOB_STATUS"
    - name: Remove private workspace
      if: always()
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/private-ci-control/private_guard.py" clean
        rm -rf deps keystore
        find . -maxdepth 1 -type f -name "*.jks" -delete
    env:
      PRIVATE_CI_TOKEN: ${{ secrets.PRIVATE_CI_TOKEN }}
      CI_JOB_KEY: ${{ github.job }}-${{ strategy.job-index }}
      GOPROXY: https://proxy.golang.org|direct
    if: github.repository_owner == 'oneclickvirt' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v'))
  publish:
    name: Publish successful build
    needs:
    - prepare
    - build-android
    - build-desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/ecs-gui/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
    - name: Publish completed release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        GH_REPO: ${{ github.repository }}
      run: |
        source "$RUNNER_TEMP/ci-network.sh"
        gh release edit "$RELEASE_TAG" --draft=false
      shell: bash
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to recover with current CI controls
