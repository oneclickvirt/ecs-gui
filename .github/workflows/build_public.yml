name: Publish Public Source Branch
permissions:
  contents: write
env:
  GONOSUMDB: github.com/oneclickvirt/ecs,github.com/oneclickvirt/speedtest
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event
      == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: public-source-${{ github.event.workflow_run.head_sha || inputs.ref }}
      cancel-in-progress: false
    steps:
    - name: Checkout released source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Install Linux desktop build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev xorg-dev
    - name: Confirm a released tag points at this revision
      id: release
      shell: bash
      run: |
        set -euo pipefail
        target_sha="$(git rev-parse HEAD)"
        git fetch --force --tags origin
        release_tag="$(git tag --points-at "$target_sha" --list 'v[0-9]*' | sort -V | tail -n 1)"
        if [[ -z "$release_tag" ]]; then
          echo "The selected revision is not a versioned release tag" >&2
          exit 1
        fi
        echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
        echo "sha=$(git rev-list -n 1 "$release_tag")" >> "$GITHUB_OUTPUT"
    - name: Generate and validate public source
      shell: bash
      run: |
        set -euo pipefail
        git checkout -B public "${{ steps.release.outputs.sha }}"
        git fetch --no-tags --depth=1 origin main
        git show FETCH_HEAD:.back/create_public_branch.py > "$RUNNER_TEMP/public-source-generator.py"
        python3 "$RUNNER_TEMP/public-source-generator.py"
        go mod tidy
        if rg -n 'github\.com/oneclickvirt/(security|privatespeedtest)(/|[[:space:]]|"|\x60|$)' --glob '*.go' --glob 'go.mod' --glob 'go.sum' .; then
          echo "Public source retained a private repository reference" >&2
          exit 1
        fi
        if rg -n 'github\.com/oneclickvirt/(security|privatespeedtest)(/|[[:space:]]|"|\x60|$)' .github/workflows; then
          echo "Public workflow still loads a private repository" >&2
          exit 1
        fi
        if go list -deps ./... | grep -E '^github\.com/oneclickvirt/(security|privatespeedtest)(/|$)'; then
          echo "Public dependency graph still loads a private repository" >&2
          exit 1
        fi
        go test ./...
        go test -tags=ecs_structured ./...
        go build -o ecs-gui-public .
        rm -f ecs-gui-public
    - name: Commit and push public branch
      shell: bash
      run: |
        set -euo pipefail
        source .github/scripts/ci_network.sh
        previous_public="$(git ls-remote origin refs/heads/public | cut -f1)"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "Public generator produced no changes" >&2
          exit 1
        fi
        git commit -m "Auto update public version from ${{ steps.release.outputs.tag }}"
        git push "--force-with-lease=refs/heads/public:$previous_public" origin HEAD:refs/heads/public
    env:
      GOPROXY: https://proxy.golang.org|direct
'on':
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or commit to publish
        required: true
        type: string
  workflow_run:
    workflows:
    - Build All UI APP
    types:
    - completed
concurrency:
  group: public-source-publication
  cancel-in-progress: false
